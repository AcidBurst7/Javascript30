<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>09 - 14 Must Know Dev Tools Tricks</title>
</head>

<body>
	<p onclick="makeGreen()">xBREAKxDOWNx</p>

	<script>
		const dogs = [
			{ name: 'Sneakers', age: 2 },
			{ name: 'Hugo', age: 8 },
		];

		// function makeGreen() {
		// 	const p = document.querySelector('p');
		// 	p.style.color = '#BADA55';
		// 	p.style.fintSize = '50px';
		// }

		// Regular
		// console.log('Hello, Wild World!');

		// Interpolated
		// console.log('Hello, I\'m a %s string', '💩');

		// Styled
		// console.log('%c I am a styled string', 'font-size: 25px; background: red; text-shadow: 5px 5px 0 blue');

		// Warning
		console.warn('Warning!');

		// Error
		console.error('Error!');

		// Info
		console.info('Info!');

		// Testing
		const p = document.querySelector('p')
		// console.assert(p.classList.contains('ouch'), "It's wrong!");

		// Clearing
		console.clear();

		// Viewing DOM Elements
		console.log(p)
		console.dir(p);

		// Grouping together
		dogs.forEach(dog => {
			// console.group(`${dog.name}`);
			console.groupCollapsed(`${dog.name}`);
			console.log(`This is ${dog.name}.`);
			console.log(`${dog.name} is ${dog.age} years old`);
			console.log(`${dog.name} is ${dog.age * 7} dog years old`);
			console.groupEnd(`${dog.name}`);
		});

		// counting
		console.count('Steve');
		console.count('Steve');
		console.count('Robe');
		console.count('Steve');
		console.count('Steve');
		console.count('Robe');

		// timing
		console.time('fetching data');
		fetch('https://api.github.com/users/AcidBurst7')
			.then(data => data.json())
			.then(data => {
				console.timeEnd('fetching data');
				console.log(data);
			});

		console.table(dogs);
	</script>
</body>

</html>
