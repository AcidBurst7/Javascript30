<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>03 - Playing with CSS Variables and JS</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<h2>
		Update CSS Variables with
		<span class="h1">JS</span>
	</h2>
	<div class="controls">
		<label for="spacing">Spacing:</label>
		<input type="range" name="spacing" min="10" max="200" value="10" data-sizing="px">

		<label for="blur">Blur:</label>
		<input type="range" name="blur" min="0" max="25" value="10" data-sizing="px">

		<label for="image-color">Base Color</label>
		<input type="color" name="image-color" vaue="#ffc600">
	</div>

	<img src="mavis-hopper-AO9_BtD92fc-unsplash.jpg" width="400" alt="">

	<script src="script.js"></script>
</body>

</html>
